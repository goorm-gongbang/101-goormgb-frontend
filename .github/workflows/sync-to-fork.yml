# .github/workflows/sync-to-fork.yml
name: Trigger Fork Sync

on:
    push:
        branches:
            - dev
            - staging
            - prod

jobs:
    trigger:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger fork sync
              env:
                  FORK_PAT: ${{ secrets.FORK_PAT }}
                  BRANCH: ${{ github.ref_name }}
                  COMMIT: ${{ github.sha }}
                  MESSAGE: ${{ github.event.head_commit.message }}
              run: |
                  jq -n \
                    --arg branch "$BRANCH" \
                    --arg commit "$COMMIT" \
                    --arg message "$MESSAGE" \
                    '{event_type: "sync", client_payload: {branch: $branch, commit: $commit, message: $message}}' | \
                  curl -X POST \
                    -H "Authorization: token $FORK_PAT" \
                    -H "Accept: application/vnd.github.v3+json" \
                    https://api.github.com/repos/techupgrgbcn-crypto/goormgb-frontend/dispatches \
                    -d @-

            - name: Notify Discord (Staging/Prod only)
              if: github.ref_name == 'staging' || github.ref_name == 'prod'
              env:
                  WEBHOOK_STAGING: ${{ secrets.DISCORD_WEBHOOK_STAGING }}
                  WEBHOOK_PROD: ${{ secrets.DISCORD_WEBHOOK_PROD }}
                  BRANCH: ${{ github.ref_name }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [ "$BRANCH" = "staging" ]; then
                    WEBHOOK="$WEBHOOK_STAGING"
                    EMOJI="🧪"
                    ENV_NAME="Staging"
                    COLOR=3447003
                    SITE_URL="staging.playball.one"
                  else
                    WEBHOOK="$WEBHOOK_PROD"
                    EMOJI="🚀"
                    ENV_NAME="Production"
                    COLOR=15105570
                    SITE_URL="playball.one"
                  fi

                  COMMIT_SHORT="${GITHUB_SHA:0:7}"

                  curl -X POST "$WEBHOOK" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"embeds\": [{
                        \"title\": \"${EMOJI} ${ENV_NAME} 배포\",
                        \"color\": ${COLOR},
                        \"fields\": [
                          {\"name\": \"Branch\", \"value\": \"${BRANCH}\", \"inline\": true},
                          {\"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                          {\"name\": \"Commit\", \"value\": \"[\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\", \"inline\": false},
                          {\"name\": \"Site\", \"value\": \"[${SITE_URL}](https://${SITE_URL})\", \"inline\": false}
                        ],
                        \"footer\": {\"text\": \"PlayBall Frontend\"},
                        \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                      }]
                    }"
