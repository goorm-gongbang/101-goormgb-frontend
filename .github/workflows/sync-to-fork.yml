# .github/workflows/sync-to-fork.yml
name: Trigger Fork Sync

on:
    push:
        branches:
            - dev
            - staging
            - prod

jobs:
    trigger:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger fork sync
              run: |
                  curl -X POST \
                    -H "Authorization: token ${{ secrets.FORK_PAT }}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    https://api.github.com/repos/techupgrgbcn-crypto/goormgb-frontend/dispatches \
                    -d '{"event_type":"sync"}'
